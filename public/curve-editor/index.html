<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Demand curve editor</title>
<style>
  :root { --bg: #1e1e1e; --panel: #2a2a2a; --grid: #3a3a3a; --text: #ddd; --muted: #999; --curve: #fff; --accent: #ff8c00; --step: #4f9de0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 14px; background: var(--panel); border-bottom: 1px solid #111; }
  header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
  label { display: flex; align-items: center; gap: 4px; color: var(--muted); }
  input, select { background: #1b1b1b; color: var(--text); border: 1px solid #444; border-radius: 4px; padding: 4px 6px; font: inherit; }
  input[type=number] { width: 70px; }
  button { font: inherit; border: 0; border-radius: 4px; padding: 7px 12px; cursor: pointer; background: #444; color: var(--text); }
  button:hover { filter: brightness(1.15); }
  #copy { background: var(--accent); color: #111; font-weight: 700; font-size: 14px; padding: 8px 16px; min-width: 110px; }
  .spacer { flex: 1; }
  #window { color: var(--muted); }
  #action { min-width: 210px; padding: 3px 8px; border-radius: 4px; background: #1b1b1b; border: 1px solid #444; }
  #action.active { border-color: var(--accent); color: var(--accent); }
  main { flex: 1; min-height: 0; position: relative; }
  svg { width: 100%; height: 100%; display: block; user-select: none; touch-action: none; cursor: default; }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .axis-label { fill: var(--muted); font-size: 12px; }
  .axis-title { fill: var(--accent); font-size: 12px; font-weight: 600; }
  .curve { fill: none; stroke: var(--curve); stroke-width: 2.5; }
  .steps { fill: none; stroke: var(--step); stroke-width: 1.5; stroke-dasharray: 4 3; opacity: 0.9; }
  .area { fill: rgba(255, 140, 0, 0.08); }
  .pt { fill: var(--accent); stroke: #111; stroke-width: 1.5; cursor: grab; }
  .pt.end { fill: #ffd2a0; }
  .pt:hover, .pt.drag { r: 9; }
  #tip { position: absolute; pointer-events: none; background: #000c; color: #fff; padding: 3px 7px; border-radius: 3px; font-size: 12px; display: none; white-space: nowrap; }
  footer { padding: 6px 14px; color: var(--muted); font-size: 12px; background: var(--panel); border-top: 1px solid #111; }
</style>
</head>
<body>
<header>
  <h1>Demand curve</h1>
  <span id="window"></span>
  <span id="action">Action: none</span>
  <label>Sets <select id="field"><option value="multiplier">× multiplier</option><option value="adder">+ req/hr</option></select></label>
  <label>Base <input id="base" type="number" step="any"></label>
  <label>Peak <input id="peak" type="number" step="any"></label>
  <label>Step <select id="step"><option value="15">15 min</option><option value="30">30 min</option><option value="60">1 hour</option></select></label>
  <span class="spacer"></span>
  <button id="reset" title="Back to the default curve">Reset curve</button>
  <button id="download" title="Save as demand-curve.csv">Download</button>
  <button id="copy">Copy CSV</button>
</header>
<main><svg id="chart"></svg><div id="tip"></div></main>
<footer>Drag points to shape demand over the event. Click the curve to add a point on it, drag points to reshape, right-click a point to remove it. The dashed blue line is what the CSV will contain. Copy CSV, then paste it into the event in Garage.</footer>
<script>
// Demand curve editor for Garage Planning. Opened from Garage with the event window in the URL:
//   #start=2026-10-04T18:00&end=2026-10-04T23:00&tz=US/Central[&field=adder&base=0&peak=300&pts=0:0,0.5:1,1:0]
// start/end are the event's wall-clock times; pts are fraction-of-window:height (0 = Base,
// 1 = Peak). Exports CSV rows fraction,multiplier,adder.

// Drop the service worker left by the previous editor build at this path.
navigator.serviceWorker?.getRegistrations().then((rs) => rs.forEach((r) => r.unregister()));

const params = new URLSearchParams(location.hash.slice(1));
const DEFAULT_PTS = [[0, 0], [0.35, 0.12], [0.7, 1], [1, 0]];
const startMs = Date.parse(`${params.get('start')}Z`);
const endMs = Date.parse(`${params.get('end')}Z`);
const hasWindow = Number.isFinite(startMs) && Number.isFinite(endMs) && endMs > startMs;
const durMs = hasWindow ? endMs - startMs : 3 * 3600e3;
const $ = (id) => document.getElementById(id);
const fieldEl = $('field'); const baseEl = $('base'); const peakEl = $('peak'); const stepEl = $('step');
fieldEl.value = params.get('field') === 'adder' ? 'adder' : 'multiplier';
baseEl.value = params.get('base') ?? (fieldEl.value === 'adder' ? 0 : 1);
peakEl.value = params.get('peak') ?? (fieldEl.value === 'adder' ? 100 : 3);
stepEl.value = durMs > 12 * 3600e3 ? '60' : '30';

// Endpoints pinned to the window edges, x strictly increasing, y within [0, 1].
function sanitize(list) {
  const clean = list.map(([x, y]) => [Math.min(1, Math.max(0, x)), Math.min(1, Math.max(0, y))]).sort((a, b) => a[0] - b[0])
    .filter((p, i, a) => !i || p[0] - a[i - 1][0] > 1e-4);
  if (clean.length < 2) return clean;
  clean[0][0] = 0; clean[clean.length - 1][0] = 1;
  return clean;
}
const parsePts = (s) => (s || '').split(',').map((p) => p.split(':').map(Number)).filter((p) => p.length === 2 && p.every(Number.isFinite));
let pts = sanitize(parsePts(params.get('pts')));
if (pts.length < 2) pts = DEFAULT_PTS.map((p) => [...p]);

// Monotone cubic (Fritsch–Carlson): smooth, but never overshoots its neighbours, so the curve
// stays between Base and Peak.
function tangents(p) {
  const n = p.length; const d = []; const m = new Array(n).fill(0);
  for (let i = 0; i < n - 1; i++) d.push((p[i + 1][1] - p[i][1]) / (p[i + 1][0] - p[i][0]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
    const a = m[i] / d[i]; const b = m[i + 1] / d[i]; const h = a * a + b * b;
    if (h > 9) { const t = 3 / Math.sqrt(h); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
  }
  return m;
}
function heightAt(x) {
  const m = tangents(pts);
  let i = pts.findIndex((p, k) => k < pts.length - 1 && x <= pts[k + 1][0]);
  if (i < 0) i = pts.length - 2;
  const [x0, y0] = pts[i]; const [x1, y1] = pts[i + 1]; const h = x1 - x0; const t = (x - x0) / h;
  const t2 = t * t; const t3 = t2 * t;
  const y = (2 * t3 - 3 * t2 + 1) * y0 + (t3 - 2 * t2 + t) * h * m[i] + (-2 * t3 + 3 * t2) * y1 + (t3 - t2) * h * m[i + 1];
  return Math.min(1, Math.max(0, y));
}

const num = (el, d) => (el.value !== '' && Number.isFinite(Number(el.value)) ? Number(el.value) : d);
const valueOf = (h) => { const b = num(baseEl, 0); return b + (num(peakEl, b) - b) * h; };
const round = (v) => Math.round(v * 1000) / 1000;
const fmtValue = (v) => (fieldEl.value === 'multiplier' ? `×${round(v)}` : `${v >= 0 ? '+' : ''}${round(v)}`);
const clock = (ms) => new Date(ms).toISOString().slice(11, 16);
const day = (ms) => new Date(ms).toLocaleDateString('en-US', { timeZone: 'UTC', weekday: 'short', month: 'numeric', day: 'numeric' });
const fmtTime = (frac) => (hasWindow ? clock(startMs + frac * durMs) : `${Math.round(frac * 100)}%`);

// Steps the CSV will hold: one per step size, valued at each step's midpoint.
function stepRows() {
  const stepMs = Number(stepEl.value) * 60e3;
  const n = Math.max(1, Math.min(500, Math.ceil(durMs / stepMs)));
  return Array.from({ length: n }, (_, i) => {
    const f0 = (i * stepMs) / durMs; const f1 = Math.min(1, ((i + 1) * stepMs) / durMs);
    return { fraction: round(f0), value: round(valueOf(heightAt((f0 + f1) / 2))), end: f1 };
  });
}

const svg = $('chart'); const tip = $('tip');
const NS = 'http://www.w3.org/2000/svg';
const M = { l: 70, r: 24, t: 24, b: 58 };
let W = 0; let H = 0; let drag = null;
const px = (f) => M.l + f * (W - M.l - M.r);
const py = (h) => M.t + (1 - h) * (H - M.t - M.b);
const fx = (x) => (x - M.l) / (W - M.l - M.r);
const fy = (y) => 1 - (y - M.t) / (H - M.t - M.b);
const el = (tag, attrs, text) => {
  const e = document.createElementNS(NS, tag);
  Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v));
  if (text != null) e.textContent = text;
  svg.appendChild(e);
  return e;
};
const niceTimeStep = () => [5, 10, 15, 30, 60, 120, 180, 360, 720, 1440].map((m) => m * 60e3).find((s) => s >= durMs / 8) || 1440 * 60e3;
const pathOf = (list) => `M ${list.map((p) => p.join(' ')).join(' L ')}`;

function draw() {
  W = svg.clientWidth; H = svg.clientHeight;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.replaceChildren();
  // y axis: Base .. Peak in 4 bands, labelled with real values.
  for (let k = 0; k <= 4; k++) {
    el('line', { x1: M.l, x2: W - M.r, y1: py(k / 4), y2: py(k / 4), class: 'gridline' });
    el('text', { x: M.l - 8, y: py(k / 4) + 4, 'text-anchor': 'end', class: 'axis-label' }, fmtValue(valueOf(k / 4)));
  }
  el('text', { x: M.l - 8, y: M.t - 8, 'text-anchor': 'end', class: 'axis-title' }, 'Peak');
  // x axis: the event's times.
  if (hasWindow) {
    // A tick every hour (every 30 min on short windows), labelled where there's room; the day
    // goes under the first tick and under every midnight.
    const step = durMs <= 3 * 3600e3 ? 1800e3 : 3600e3;
    const ticks = [];
    for (let t = Math.ceil(startMs / step) * step; t <= endMs; t += step) ticks.push(t);
    const every = Math.max(1, Math.ceil(ticks.length / Math.max(1, (W - M.l - M.r) / 48)));
    ticks.forEach((t, k) => {
      const f = (t - startMs) / durMs;
      el('line', { x1: px(f), x2: px(f), y1: M.t, y2: H - M.b, class: 'gridline' });
      if (k % every === 0) el('text', { x: px(f), y: H - M.b + 16, 'text-anchor': 'middle', class: 'axis-label' }, clock(t));
      if (k === 0 || clock(t) === '00:00') {
        el('text', { x: px(f), y: H - M.b + 30, 'text-anchor': 'middle', class: 'axis-title' }, day(t));
      }
    });
  } else {
    for (let k = 0; k <= 8; k++) {
      el('line', { x1: px(k / 8), x2: px(k / 8), y1: M.t, y2: H - M.b, class: 'gridline' });
      el('text', { x: px(k / 8), y: H - M.b + 18, 'text-anchor': 'middle', class: 'axis-label' }, fmtTime(k / 8));
    }
  }
  el('text', { x: px(0), y: H - 8, 'text-anchor': 'start', class: 'axis-title' }, hasWindow ? `Start ${clock(startMs)}` : 'Start');
  el('text', { x: px(1), y: H - 8, 'text-anchor': 'end', class: 'axis-title' }, hasWindow ? `End ${clock(endMs)}` : 'End');
  // Curve and the area under it.
  const line = Array.from({ length: 241 }, (_, i) => [px(i / 240), py(heightAt(i / 240))]);
  el('path', { d: `${pathOf([[px(0), py(0)], ...line, [px(1), py(0)]])} Z`, class: 'area' });
  el('path', { d: pathOf(line), class: 'curve' });
  // The steps the CSV will contain.
  const b = num(baseEl, 0); const span = num(peakEl, b) - b || 1;
  el('path', { d: pathOf(stepRows().flatMap((r) => { const h = (r.value - b) / span; return [[px(r.fraction), py(h)], [px(r.end), py(h)]]; })), class: 'steps' });
  // Points; the end points only move up and down.
  pts.forEach(([x, y], i) => {
    const c = el('circle', { cx: px(x), cy: py(y), r: 7, class: `pt${i === 0 || i === pts.length - 1 ? ' end' : ''}${drag === i || hover === i ? ' drag' : ''}` });
    c.dataset.i = i;
  });
}

function showTip(clientX, clientY, f) {
  const rect = svg.getBoundingClientRect();
  tip.style.display = 'block';
  tip.style.left = `${clientX - rect.left + 12}px`;
  tip.style.top = `${clientY - rect.top - 28}px`;
  tip.textContent = `${fmtTime(f)} · ${fmtValue(valueOf(heightAt(f)))}`;
}

// Points are grabbed (and right-click removed) within GRAB_PX of the pointer, not just on the dot.
const GRAB_PX = 18;
const CURVE_HIT_PX = 16; // clicks this close to the curve add a point on it
let hover = null;
let dragged = false;
function nearestPoint(e) {
  const rect = svg.getBoundingClientRect();
  const mx = e.clientX - rect.left; const my = e.clientY - rect.top;
  let best = null; let bestD = GRAB_PX;
  pts.forEach(([x, y], i) => {
    const d = Math.hypot(px(x) - mx, py(y) - my);
    if (d <= bestD) { best = i; bestD = d; }
  });
  return best;
}
function setHover(i) {
  if (i === hover) return;
  hover = i;
  draw();
}
// The cursor says what a click does: grab a point, add a point on the curve, or nothing.
// ...and the action label names it.
function setAction(text) {
  const label = $('action');
  label.textContent = `Action: ${text}`;
  label.classList.toggle('active', text !== 'none');
}
function updateCursor(e) {
  if (drag != null) { svg.style.cursor = 'grabbing'; setAction('moving point'); return; }
  if (hover != null) {
    svg.style.cursor = 'grab';
    const pinned = hover === 0 || hover === pts.length - 1;
    setAction(pinned ? 'move point (end, up/down only)' : 'move point · right-click removes');
    return;
  }
  const rect = svg.getBoundingClientRect();
  const f = fx(e.clientX - rect.left);
  const onCurve = f > 0 && f < 1 && Math.abs(py(heightAt(f)) - (e.clientY - rect.top)) <= CURVE_HIT_PX;
  svg.style.cursor = onCurve ? 'copy' : 'default';
  setAction(onCurve ? 'insert point' : 'none');
}

svg.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  const i = nearestPoint(e);
  if (i == null) return;
  drag = i;
  dragged = true; // the click that follows must not add a point
  svg.style.cursor = 'grabbing';
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener('pointermove', (e) => {
  const rect = svg.getBoundingClientRect();
  const f = Math.min(1, Math.max(0, fx(e.clientX - rect.left)));
  if (drag != null) {
    // Points can't pass their neighbours, so time only moves forward.
    const gap = 0.005;
    const x = drag === 0 ? 0 : drag === pts.length - 1 ? 1 : Math.min(pts[drag + 1][0] - gap, Math.max(pts[drag - 1][0] + gap, f));
    pts[drag] = [x, Math.min(1, Math.max(0, fy(e.clientY - rect.top)))];
    draw();
    showTip(e.clientX, e.clientY, x);
    return;
  }
  setHover(nearestPoint(e));
  updateCursor(e);
  if (e.clientX - rect.left >= M.l && e.clientX - rect.left <= W - M.r) showTip(e.clientX, e.clientY, hover == null ? f : pts[hover][0]);
  else tip.style.display = 'none';
});
svg.addEventListener('pointerup', (e) => {
  if (drag == null) return;
  drag = null;
  setHover(nearestPoint(e));
  updateCursor(e);
  draw();
});
svg.addEventListener('pointerleave', () => { if (drag == null) { tip.style.display = 'none'; setHover(null); svg.style.cursor = 'default'; setAction('none'); } });
const removePoint = (i) => { if (i > 0 && i < pts.length - 1) { pts.splice(i, 1); hover = null; draw(); } };
// A left click on (or near) the curve adds a point on it, which can then be dragged; clicks
// elsewhere do nothing.
svg.addEventListener('click', (e) => {
  if (e.button !== 0) return;
  if (dragged) { dragged = false; return; }
  const rect = svg.getBoundingClientRect();
  const f = fx(e.clientX - rect.left);
  if (f <= 0 || f >= 1) return;
  if (Math.abs(py(heightAt(f)) - (e.clientY - rect.top)) > CURVE_HIT_PX) return;
  pts = sanitize([...pts, [f, heightAt(f)]]);
  draw();
});
// The view is fixed: no scrolling, pinch or ctrl-wheel zoom over the chart.
svg.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
svg.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  const i = nearestPoint(e);
  if (i != null) removePoint(i);
});

$('reset').addEventListener('click', () => { pts = DEFAULT_PTS.map((p) => [...p]); draw(); });
const csvText = () => `${['fraction,multiplier,adder', ...stepRows().map((r) => (fieldEl.value === 'multiplier' ? `${r.fraction},${r.value},0` : `${r.fraction},1,${r.value}`))].join('\n')}\n`;
$('copy').addEventListener('click', () => {
  navigator.clipboard.writeText(csvText()).then(() => {
    $('copy').textContent = 'Copied ✓';
    setTimeout(() => { $('copy').textContent = 'Copy CSV'; }, 1500);
  });
});
$('download').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csvText()], { type: 'text/csv' }));
  a.download = 'demand-curve.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 100);
});
[fieldEl, baseEl, peakEl, stepEl].forEach((x) => x.addEventListener('input', () => {
  if (x === fieldEl) { baseEl.value = fieldEl.value === 'adder' ? 0 : 1; peakEl.value = fieldEl.value === 'adder' ? 100 : 3; }
  draw();
}));
if (hasWindow) {
  $('window').textContent = `${new Date(startMs).toISOString().slice(0, 16).replace('T', ' ')} → ${clock(endMs)}${params.get('tz') ? ` ${params.get('tz')}` : ''}`;
}
new ResizeObserver(draw).observe(svg);
draw();
</script>
</body>
</html>
